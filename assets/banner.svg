<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Glow Gradients -->
    <radialGradient id="glowPurple" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowBlue" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Animated Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>

    <!-- Styles & Animations -->
    <style>
      @keyframes floatParticle {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.4; }
        50% { transform: translateY(-12px) scale(1.15); opacity: 0.8; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.05); }
      }
      @keyframes waveFlow {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 200; }
      }
      .particle { animation: floatParticle 6s ease-in-out infinite; }
      .particle-delayed { animation: floatParticle 7s ease-in-out infinite 2.5s; }
      .glow-bg { animation: pulseGlow 8s ease-in-out infinite alternate; transform-origin: center; }
      .wave-line { stroke-dasharray: 10, 10; animation: waveFlow 12s linear infinite; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
      .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
      .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 12px; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="260" rx="16" fill="url(#bgGrad)" />
  <rect width="900" height="260" rx="16" fill="url(#grid)" />

  <!-- Animated Ambient Glows (Background Layer) -->
  <circle cx="200" cy="80" r="180" fill="url(#glowPurple)" class="glow-bg" />
  <circle cx="700" cy="180" r="180" fill="url(#glowBlue)" class="glow-bg" />

  <!-- Dynamic Tech Line & Floating Nodes (Background Dynamic Layer) -->
  <path d="M 50 200 Q 250 140 450 180 T 850 110" fill="none" stroke="url(#textGrad)" stroke-width="2" opacity="0.3" class="wave-line" />
  
  <circle cx="150" cy="60" r="4" fill="#60a5fa" class="particle" />
  <circle cx="780" cy="70" r="5" fill="#a78bfa" class="particle-delayed" />
  <circle cx="820" cy="210" r="3.5" fill="#f472b6" class="particle" />
  <circle cx="100" cy="210" r="4.5" fill="#34d399" class="particle-delayed" />

  <!-- Foreground Content Area Header Card -->
  <rect x="40" y="30" width="820" height="200" rx="12" fill="#161b22" fill-opacity="0.55" stroke="url(#cardBorder)" stroke-width="1.5" />

  <!-- FOREGROUND TEXT (Strictly on Top Layer) -->
  <!-- Top Badge / Category Pill -->
  <g transform="translate(65, 52)">
    <rect width="210" height="26" rx="13" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="105" y="17" fill="#60a5fa" class="pill-text" text-anchor="middle">⚡ TOP SUPPORT PORTALS 2026</text>
  </g>

  <!-- Main Title -->
  <text x="65" y="122" fill="#ffffff" class="title-text" font-size="30" letter-spacing="-0.5">
    Awesome Technical Support Portals
  </text>

  <!-- Subtitle -->
  <text x="65" y="154" fill="#9ca3af" class="sub-text" font-size="15">
    Curated SaaS Platforms, Enterprise Helpdesks &amp; Open-Source Support Frontends
  </text>

  <!-- Foreground Feature Badges -->
  <g transform="translate(65, 178)">
    <!-- Badge 1 -->
    <g transform="translate(0, 0)">
      <rect width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="65" y="18" fill="#38bdf8" class="pill-text" text-anchor="middle">🏢 Enterprise SaaS</text>
    </g>
    <!-- Badge 2 -->
    <g transform="translate(142, 0)">
      <rect width="145" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="72" y="18" fill="#a78bfa" class="pill-text" text-anchor="middle">⭐ Open-Source Stars</text>
    </g>
    <!-- Badge 3 -->
    <g transform="translate(299, 0)">
      <rect width="140" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="70" y="18" fill="#34d399" class="pill-text" text-anchor="middle">🔒 Self-Hosted Tech</text>
    </g>
    <!-- Badge 4 -->
    <g transform="translate(451, 0)">
      <rect width="150" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="75" y="18" fill="#f472b6" class="pill-text" text-anchor="middle">💡 Knowledge Bases</text>
    </g>
  </g>
</svg>
